# ============================================================================
# CI（docs/16 §3）
#
# · 两个 job：
#     verify —— install / typecheck / lint / test，**所有 push + PR 都跑**
#     build  —— install / build，**仅 push 到 main 时跑**（裁决 ②）
# · Node 24.x（与 package.json 的 engines 一致，满足 Prisma 7 的 >=24.0）
# · **双轨（M6-5 恢复）**：verify job 为矩阵 `track: [sqlite, postgres]` ——
#   sqlite 轨用 `file:./prisma/ci.db`（零 service）、postgres 轨用 `postgres:16` service；
#   建表统一用 `prisma db push`（`prisma/migrations/` 已删，两轨都不建 migrations）；
#   每轨先跑 `node scripts/gen-sqlite-schema.mjs --check` 校验两份 schema 同步。
#   build job 不需要真库，只给 dummy PG 串让 `prisma generate`（PG 轨）通过。
# · 不跑 E2E（docs/16 §5：太慢，仅本地演示前跑）
# · 项目在 app/ 子目录：**所有步骤的 working-directory 都是 app**，
#   根目录只用于承载 git 钩子（husky），CI 不在根装依赖
# · ⚠ **必须 generate**：Prisma Client 产物 `app/src/generated/` 被 `app/.gitignore:64`
#   忽略（T1.1 三重声明的正确做法）→ CI clone 后**只有源码、没有生成物**，
#   故 `typecheck` / `build` 前必须跑一次 `pnpm prisma generate`。
#   （2026-10-02 首次 CI 失败的根因即此：TS2307 找不到 `@/generated/prisma/client`
#     + 4 处隐式 any 的级联。）
# ============================================================================

name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  verify:
    name: verify（${{ matrix.track }}）
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 双轨矩阵（M6-5）：本地默认 SQLite、生产是 PG ⇒ 两轨都测（docs/11 A31 / docs/16 §3）
        # ⚠ GitHub 不支持"条件 service" ⇒ sqlite 轨也会把 postgres 容器起起来（不连它即可）
        track: [sqlite, postgres]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 按轨取连接串：`file:` ⇒ SQLite（零 service）；`postgresql:` ⇒ 上面那个 service 容器。
      # prisma.config.ts 按同一前缀自动选 schema（schema.sqlite.prisma / schema.prisma）。
      DATABASE_URL: ${{ matrix.track == 'sqlite' && 'file:./prisma/ci.db' || 'postgresql://postgres:postgres@localhost:5432/campus_test' }}
      DIRECT_URL: ${{ matrix.track == 'sqlite' && 'file:./prisma/ci.db' || 'postgresql://postgres:postgres@localhost:5432/campus_test' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check SQLite schema sync
        # 两份 schema 必须只差 provider 行（否则 sqlite 轨会与 pg 轨漂移）
        run: node scripts/gen-sqlite-schema.mjs --check

      - name: Generate Prisma Client
        # 按 DATABASE_URL 前缀自动选 schema（prisma.config.ts），无需显式 --schema
        run: pnpm prisma generate

      - name: Setup test database
        # seed-idempotency 用例需要真实库：postgres 轨用 service 容器、sqlite 轨用文件库；
        # 无 migrations ⇒ 用 db push 建表（测试体内也会 push 一次，幂等重复）
        run: pnpm prisma db push

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test（Vitest：unit + component）
        run: pnpm test

  build:
    name: build（仅 main push）
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # 构建期不连库：dummy 串即可（`prisma generate` 只读 schema，不建立连接）
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      # 构建期不启动服务；给一个 CI 专用占位值（生产密钥由部署平台注入）
      AUTH_SECRET: "ci-build-only-not-a-secret"
      NEXT_PUBLIC_SITE_URL: "https://example.invalid"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build
        run: pnpm build
