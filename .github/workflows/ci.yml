# ============================================================================
# CI（docs/16 §3）
#
# · 两个 job：
#     verify —— install / typecheck / lint / test，**所有 push + PR 都跑**
#     build  —— install / build，**仅 push 到 main 时跑**（裁决 ②）
# · Node 24.x（与 package.json 的 engines 一致，满足 Prisma 7 的 >=24.0）
# · PostgreSQL：M6 Step 4b 起本地/生产统一 PG ⇒ verify job 起 `postgres:16` service 容器，
#   建表用 `prisma db push`（`prisma/migrations/` 已随 SQLite 双轨一并删除）；
#   build job 不需要真库，只给 dummy 串让 `prisma generate` 通过。
# · 不跑 E2E（docs/16 §5：太慢，仅本地演示前跑）
# · 项目在 app/ 子目录：**所有步骤的 working-directory 都是 app**，
#   根目录只用于承载 git 钩子（husky），CI 不在根装依赖
# · ⚠ **必须 generate**：Prisma Client 产物 `app/src/generated/` 被 `app/.gitignore:64`
#   忽略（T1.1 三重声明的正确做法）→ CI clone 后**只有源码、没有生成物**，
#   故 `typecheck` / `build` 前必须跑一次 `pnpm prisma generate`。
#   （2026-10-02 首次 CI 失败的根因即此：TS2307 找不到 `@/generated/prisma/client`
#     + 4 处隐式 any 的级联。）
# ============================================================================

name: CI

on:
  push:
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: app

jobs:
  verify:
    name: verify（install / typecheck / lint / test）
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: campus_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # 单测不连库；seed-idempotency（CI 专用）连下面这个 service 容器
      DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/campus_test"
      DIRECT_URL: "postgresql://postgres:postgres@localhost:5432/campus_test"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Setup test database
        # seed-idempotency 用例需要真实 PostgreSQL；无 migrations ⇒ 用 db push 建表
        # （测试体内也会 push 一次，幂等重复）
        run: pnpm prisma db push

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test（Vitest：unit + component）
        run: pnpm test

  build:
    name: build（仅 main push）
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      # 构建期不连库：dummy 串即可（`prisma generate` 只读 schema，不建立连接）
      DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      DIRECT_URL: "postgresql://dummy:dummy@localhost:5432/dummy"
      # 构建期不启动服务；给一个 CI 专用占位值（生产密钥由部署平台注入）
      AUTH_SECRET: "ci-build-only-not-a-secret"
      NEXT_PUBLIC_SITE_URL: "https://example.invalid"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.8.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm prisma generate

      - name: Build
        run: pnpm build
